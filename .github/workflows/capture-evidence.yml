name: Capture Klaviyo evidence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/capture-evidence.yml"
      - "scripts/capture-evidence.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture live evidence
        run: node scripts/capture-evidence.mjs

      - name: Commit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/evidence evidence/network-requests.json
          if git diff --cached --quiet; then
            echo "No evidence changes to commit."
          else
            git commit -m "Add high-resolution Klaviyo evidence captures"
            git push
          fi
